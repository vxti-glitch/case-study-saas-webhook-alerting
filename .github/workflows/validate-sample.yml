name: Validate webhook tooling

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate sample JSON
        run: python -m json.tool examples/discord-payload.json

      - name: Run payload guard tests
        run: python -m unittest discover -s tests -v

      - name: Generate local safe preview
        run: python src/payload_guard.py --input examples/discord-payload.json --out reports/payload-preview.md
